<!DOCTYPE html>
<html lang="bn" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { background: white; width: 100%; height: 100%; max-width: 600px; display: flex; flex-direction: column; box-shadow: 0px 0px 15px rgba(0,0,0,0.1); }
        @media (min-width: 600px) { .container { height: 90vh; border-radius: 15px; } }
        .form-section { display: none; flex-direction: column; height: 100%; padding: 25px; }
        .form-section.active { display: flex; }
        #langSection { justify-content: center; align-items: center; text-align: center; }
        .brand-logo-box { margin-bottom: 30px; }
        .welcome-text { font-size: 14px; color: #888; letter-spacing: 2px; text-transform: uppercase; font-weight: bold; margin-bottom: 5px; }
        .app-brand-title { font-size: 32px; font-weight: 800; background: linear-gradient(45deg, #1a73e8, #6f42c1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .lang-sub-text { font-size: 13px; color: #666; margin-top: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #555; font-size: 14px; text-align: left; }
        input, select, button { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
        button { background-color: #1a73e8; color: white; border: none; margin-top: 15px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #1557b0; }
        .toggle-btn { background-color: transparent; color: #1a73e8; border: none; margin-top: 15px; cursor: pointer; text-decoration: underline; font-size: 14px; }
        #chatSection { padding: 0; background: #ffffff; }
        .chat-header { padding: 10px 15px; background: #f8f9fa; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 16px; color: #333; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; background: #ffffff; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 10px 14px; border-radius: 12px; max-width: 85%; font-size: 15px; word-wrap: break-word; line-height: 1.4; }
        .user-msg { background-color: #e8f0fe; color: #1f1f1f; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background-color: #f1f3f4; color: #202124; align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-input-area { display: flex; align-items: flex-end; padding: 10px 15px; background: #fff; border-top: 1px solid #ddd; gap: 10px; }
        .chat-input-area textarea { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; font-size: 15px; resize: none; max-height: 120px; outline: none; font-family: Arial, sans-serif; box-sizing: border-box; }
        .chat-input-area button { width: 45px; height: 45px; margin-top: 0; border-radius: 50%; font-size: 20px; background-color: #1a73e8; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; }
        .custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 320px; text-align: center; box-shadow: 0px 5px 20px rgba(0,0,0,0.2); }
        .modal-btn { background-color: #1a73e8; margin-top: 15px; padding: 8px 15px; border-radius: 10px; }
        .lang-btn { background-color: #5f6368; margin: 8px 0; }
    </style>
</head>
<body>

    <div class="container">
        <!-- ভাষা নির্বাচন পেজ -->
        <div id="langSection" class="form-section active">
            <div class="brand-logo-box">
                <div class="welcome-text">Welcome To</div>
                <div class="app-brand-title">Partner AI</div>
            </div>
            
            <button class="lang-btn" onclick="setLanguage('bn')">বাংলা (Bengali)</button>
            <button class="lang-btn" onclick="setLanguage('en')" style="background-color: #1a73e8;">English</button>
            
            <div class="lang-sub-text" id="tSubText">দয়া করে আপনার পছন্দের ভাষা বেছে নিন / Choose your preferred language</div>
        </div>

        <!-- রেজিস্ট্রেশন ফর্ম -->
        <div id="registerSection" class="form-section">
            <h2 id="tRegTitle">পার্টনার এআই - অ্যাকাউন্ট তৈরি</h2>
            <label id="tLblName">তোমার নাম:</label>
            <input type="text" id="regName">
            <label id="tLblUser">ইউজারনেম (ID):</label>
            <input type="text" id="regUser">
            <label id="tLblPass">পাসওয়ার্ড:</label>
            <input type="password" id="regPass">
            <button onclick="registerUser()" id="tBtnReg">রেজিস্ট্রেশন করুন</button>
            <center><button class="toggle-btn" onclick="switchForm('login')" id="tBtnSwitchToLogin">ইতিমধ্যে অ্যাকাউন্ট আছে? লগইন করুন</button></center>
        </div>

        <!-- লগইন ফর্ম -->
        <div id="loginSection" class="form-section">
            <h2 id="tLoginTitle">পার্টনার এআই - লগইন</h2>
            <label id="tLblLoginUser">ইউজারনেম:</label>
            <input type="text" id="loginUser">
            <label id="tLblLoginPass">পাসওয়ার্ড:</label>
            <input type="password" id="loginPass">
            <button onclick="loginUser()" id="tBtnLogin">লগইন করুন</button>
            <center><button class="toggle-btn" onclick="switchForm('register')" id="tBtnSwitchToReg">অ্যাকাউন্ট নেই? রেজিস্ট্রেশন করুন</button></center>
        </div>

        <!-- এআই সেটআপ ফর্ম -->
        <div id="setupSection" class="form-section">
            <h2 id="tSetupTitle">পার্টনার এআই সেটআপ</h2>
            <label id="tLblGender">১. পার্টনারের ধরণ নির্বাচন করুন:</label>
            <select id="gender" onchange="updateRoleOptions()"></select>
            <label id="tLblRole">২. সম্পর্কের বা রোলের ধরণ:</label>
            <select id="role"></select>
            <label id="tLblVoice">৩. ভয়েস বা কণ্ঠস্বর পছন্দ করুন:</label>
            <select id="voice"></select>
            <button onclick="saveAiPreferences()" id="tBtnSave">সেভ করে চ্যাট শুরু করুন</button>
        </div>

        <!-- ফুল স্ক্রিন চ্যাট স্ক্রিন -->
        <div id="chatSection" class="form-section">
            <div class="chat-header">
                <span id="tChatTitle">পার্টনার এআই চ্যাট</span>
                <button onclick="toggleVoiceOutput()" id="voiceToggleBtn" style="width: auto; padding: 5px 10px; margin: 0; font-size: 14px; background-color: #e8f0fe; color: #1a73e8; border-radius: 5px; border: 1px solid #1a73e8; cursor: pointer;">
                    🔊 ভয়েস: চালু
                </button>
            </div>
            <div id="chatMessages" class="chat-box">
                <div class="message ai-msg" id="tAiGreeting">হ্যালো! আমি প্রস্তুত। যেকোনো ভাষায় কথা বলো।</div>
            </div>
            <div class="chat-input-area">
                <textarea id="userMessageInput" rows="1" placeholder="এখানে যেকোনো ভাষায় মেসেজ লিখো..." oninput="autoResizeTextarea(this)" onkeypress="handleKeyPress(event)"></textarea>
                <button onclick="sendMessage()">🤖</button>
            </div>
        </div>
    </div>

    <!-- কাস্টম মডাল -->
    <div id="customModal" class="custom-modal">
        <div class="modal-content">
            <h3 id="modalMessage">সফল বার্তা</h3>
            <button class="modal-btn" id="tModalBtn" onclick="closeModal()">ঠিক আছে (OK)</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
